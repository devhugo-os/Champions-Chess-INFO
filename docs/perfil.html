<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seu Perfil - Champions Chess INFO</title>
  <link rel="icon" type="image/png" href="/FavIcon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <main class="container">
    <!-- TELA DE PERFIL -->
    <div id="profile-container" class="grid-2">
      <!-- Configurações Gerais -->
      <div class="card">
        <h2>👤 Informações do Perfil</h2>
        
        <!-- Foto de Perfil com Upload Base64 -->
        <div class="avatar-preview-container">
          <img id="avatar-img" class="avatar-large" src="https://lh3.googleusercontent.com/a/default-user=s96-c" alt="Avatar">
          <div style="text-align: center;">
            <input type="file" id="avatar-input" accept="image/*" style="display: none;">
            <button class="btn btn-ghost" style="padding: 8px 16px; font-size: 12.5px;" onclick="document.getElementById('avatar-input').click()">Alterar Foto</button>
            <p style="font-size: 11px; margin-top: 6px;">O arquivo será comprimido e redimensionado no seu navegador.</p>
          </div>
        </div>

        <form id="profile-form">
          <div class="form-group">
            <label for="profile-name">Nome Completo</label>
            <input type="text" id="profile-name" class="form-control" placeholder="Seu Nome Completo" required>
          </div>
          <div class="form-group">
            <label>E-mail Associado</label>
            <input type="text" id="profile-email" class="form-control" disabled>
          </div>
          <div class="form-group">
            <label>Seu Saldo</label>
            <div style="font-size: 20px; font-weight: 800; color: var(--accent-color); margin-top: 4px;">
              <span id="profile-points">0</span> CCIP
            </div>
          </div>
          <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Salvar Alterações</button>
        </form>
      </div>

      <!-- Escolha de Papel no Torneio -->
      <div class="card">
        <h2>♟️ Participação no Torneio</h2>
        <p style="margin-bottom: 20px;">Você pode se cadastrar como apenas um espectador ou submeter sua inscrição para jogar na tabela oficial.</p>
        
        <div style="background-color: var(--bg-secondary); border: 1px solid var(--border-color); padding: 18px; border-radius: var(--radius-md); margin-bottom: 20px;">
          <h3 style="font-size: 15px; margin-bottom: 6px;">Status da Inscrição</h3>
          <div id="role-status-area">
            <!-- Dinâmico -->
          </div>
        </div>

        <div id="role-selection-area" style="display: flex; flex-direction: column; gap: 12px;">
          <button class="btn btn-ghost" onclick="selectRole('spectator')" style="text-align: left; justify-content: flex-start; padding: 14px;">
            👀 <b>Permanecer como Espectador</b><br>
            <span style="font-size: 12px; font-weight: normal; color: var(--text-secondary);">Apenas assista partidas, converse no chat e aposte.</span>
          </button>
          
          <button class="btn" onclick="selectRole('participant')" style="text-align: left; justify-content: flex-start; padding: 14px; background: rgba(16, 185, 129, 0.08); border: 1px solid var(--accent-color); color: var(--text-primary); box-shadow: none;">
            ♟️ <b style="color: var(--accent-color);">Solicitar Inscrição como Jogador</b><br>
            <span style="font-size: 12px; font-weight: normal; color: var(--text-secondary);">Submete seu perfil para a fila de espera. Requer aprovação do admin.</span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <span>© Champions Chess INFO</span>
  </footer>

  <script src="/js/navigation.js"></script>
  <script src="/js/security.js"></script>

  <script>
    let profileData = null;

    document.addEventListener("DOMContentLoaded", () => {
      // Configurar formulário
      document.getElementById("profile-form").addEventListener("submit", saveProfile);

      // Configurar upload de imagem
      document.getElementById("avatar-input").addEventListener("change", compressAndUploadAvatar);

      checkSession();
    });

    async function checkSession() {
      const token = document.cookie.split("; ").find(r => r.startsWith("session_token="))?.split("=")[1];
      
      if (!token) {
        window.location.href = "/login";
        return;
      }

      try {
        const res = await fetch("/api/auth/profile", {
          headers: {
            "Authorization": `Bearer ${token}`
          }
        });
        
        if (res.status === 401) {
          // Limpa sessão e redireciona
          localStorage.removeItem("user");
          document.cookie = "session_token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
          window.location.href = "/login";
          return;
        }

        const data = await res.json();
        profileData = data.profile;
        
        // Preencher formulário
        document.getElementById("profile-name").value = profileData.displayName || profileData.name;
        document.getElementById("profile-email").value = profileData.email;
        document.getElementById("profile-points").textContent = data.wallet;
        
        if (profileData.avatarBase64) {
          document.getElementById("avatar-img").src = profileData.avatarBase64;
        }

        // Renderizar status do papel
        renderRoleStatus();

      } catch (error) {
        console.error("Erro ao validar sessão:", error);
      }
    }

    function renderRoleStatus() {
      const statusArea = document.getElementById("role-status-area");
      const selectionArea = document.getElementById("role-selection-area");

      const role = profileData.role;
      const status = profileData.participantStatus;

      if (role === "admin") {
        statusArea.innerHTML = `<span class="badge badge-danger">ADMINISTRADOR</span><p style="margin-top: 8px;">Você possui controle absoluto sobre o torneio.</p>`;
        selectionArea.style.display = "none";
      } else if (role === "participant" && status === "approved") {
        statusArea.innerHTML = `<span class="badge badge-success">PARTICIPANTE APROVADO</span><p style="margin-top: 8px;">Você é um enxadrista oficial da tabela do torneio.</p>`;
        selectionArea.style.display = "none";
      } else if (status === "pending") {
        statusArea.innerHTML = `<span class="badge badge-warning">INSCRIÇÃO EM ANÁLISE</span><p style="margin-top: 8px;">Você está na lista de espera. Aguarde o administrador autorizar sua entrada.</p>`;
      } else if (status === "rejected") {
        statusArea.innerHTML = `<span class="badge badge-danger">INSCRIÇÃO RECUSADA</span><p style="margin-top: 8px;">Sua solicitação de participante foi rejeitada pela organização. Você permanece como Espectador.</p>`;
      } else {
        statusArea.innerHTML = `<span class="badge badge-info">ESPECTADOR</span><p style="margin-top: 8px;">Você está assistindo o torneio de fora. Pode dar palpites e usar o chat.</p>`;
      }
    }

    async function selectRole(roleSelection) {
      const token = document.cookie.split("; ").find(r => r.startsWith("session_token="))?.split("=")[1];
      if (!token) return;

      try {
        const res = await fetch("/api/auth/profile", {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ roleSelection })
        });
        
        const data = await res.json();
        if (data.success) {
          // Atualiza localStorage
          let userLocal = JSON.parse(localStorage.getItem("user"));
          userLocal.role = data.profile.role;
          userLocal.participantStatus = data.profile.participantStatus;
          localStorage.setItem("user", JSON.stringify(userLocal));

          window.location.reload();
        } else {
          alert(data.error || "Erro ao salvar preferência.");
        }
      } catch (error) {
        alert("Erro de conexão.");
      }
    }

    async function saveProfile(e) {
      e.preventDefault();
      const displayName = document.getElementById("profile-name").value;
      const token = document.cookie.split("; ").find(r => r.startsWith("session_token="))?.split("=")[1];
      
      try {
        const res = await fetch("/api/auth/profile", {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ displayName })
        });
        
        const data = await res.json();
        if (data.success) {
          // Atualiza localStorage
          let userLocal = JSON.parse(localStorage.getItem("user"));
          userLocal.name = data.profile.displayName;
          localStorage.setItem("user", JSON.stringify(userLocal));
          
          alert("Perfil atualizado com sucesso!");
          window.location.reload();
        } else {
          alert(data.error || "Erro ao atualizar.");
        }
      } catch (error) {
        alert("Erro de conexão.");
      }
    }

    function compressAndUploadAvatar(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = function(event) {
        const img = new Image();
        img.src = event.target.result;
        img.onload = function() {
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");
          canvas.width = 128;
          canvas.height = 128;
          
          const size = Math.min(img.width, img.height);
          const xOffset = (img.width - size) / 2;
          const yOffset = (img.height - size) / 2;
          
          ctx.drawImage(img, xOffset, yOffset, size, size, 0, 0, 128, 128);
          
          const base64Str = canvas.toDataURL("image/jpeg", 0.8);
          uploadAvatar(base64Str);
        };
      };
    }

    async function uploadAvatar(avatarBase64) {
      const token = document.cookie.split("; ").find(r => r.startsWith("session_token="))?.split("=")[1];
      if (!token) return;

      try {
        const res = await fetch("/api/auth/profile/avatar", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ avatarBase64 })
        });
        
        const data = await res.json();
        if (data.success) {
          document.getElementById("avatar-img").src = avatarBase64;
          
          let userLocal = JSON.parse(localStorage.getItem("user"));
          userLocal.avatarBase64 = avatarBase64;
          localStorage.setItem("user", JSON.stringify(userLocal));
          
          alert("Foto atualizada!");
          window.location.reload();
        } else {
          alert(data.error || "Erro ao fazer upload da foto.");
        }
      } catch (error) {
        alert("Erro de conexão.");
      }
    }
  </script>
</body>
</html>
