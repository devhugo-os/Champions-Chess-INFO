<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogadores - Champions Chess INFO</title>
  <link rel="icon" type="image/png" href="FavIcon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .players-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
    .player-card {
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 12px;
      text-align: center;
      cursor: pointer;
      background-color: rgba(13, 17, 23, 0.4);
      transition: all 0.2s ease;
    }
    .player-card:hover {
      border-color: var(--accent-color);
      transform: translateY(-2px);
    }
    .player-card.active {
      border-color: var(--accent-color);
      background-color: rgba(16, 185, 129, 0.08);
      box-shadow: 0 0 10px var(--accent-glow);
    }
    .player-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: var(--bg-secondary);
      border: 2px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 8px auto;
      font-weight: 800;
      color: var(--accent-color);
    }
    .player-card.active .player-avatar {
      border-color: var(--accent-color);
    }
  </style>
</head>
<body>

  <main class="container">
    <div class="grid-2">
      <!-- Lista de Jogadores -->
      <div>
        <!-- Grupo A -->
        <div class="card" style="margin-bottom: 20px;">
          <h2>👥 Grupo A</h2>
          <div id="group-a-players" class="players-grid">
            <p class="text-secondary">Carregando...</p>
          </div>
        </div>

        <!-- Grupo B -->
        <div class="card">
          <h2>👥 Grupo B</h2>
          <div id="group-b-players" class="players-grid">
            <p class="text-secondary">Carregando...</p>
          </div>
        </div>
      </div>

      <!-- Detalhes do Jogador -->
      <div class="card" id="details-card" style="align-self: start;">
        <h2>🔍 Detalhes do Jogador</h2>
        <div id="details-container">
          <p class="text-secondary" style="text-align: center; padding: 24px;">Clique em um jogador ao lado para ver o histórico e desempenho detalhado.</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <span>© Champions Chess INFO</span>
  </footer>

  <!-- Firebase CDNs Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <script src="js/navigation.js"></script>
  <script src="js/security.js"></script>

  <script>
    let allPlayers = [];
    let allMatches = [];
    let activePlayerId = null;

    document.addEventListener("DOMContentLoaded", () => {
      const interval = setInterval(() => {
        if (window.db) {
          clearInterval(interval);
          loadPlayersData();
        }
      }, 100);
    });

    async function loadPlayersData() {
      try {
        const [playersSnap, matchesSnap] = await Promise.all([
          window.db.collection("players").get(),
          window.db.collection("matches").get()
        ]);

        allPlayers = [];
        playersSnap.forEach(doc => { allPlayers.push({ id: doc.id, ...doc.data() }); });

        allMatches = [];
        matchesSnap.forEach(doc => { allMatches.push({ id: doc.id, ...doc.data() }); });

        renderPlayersGrid("A", "group-a-players");
        renderPlayersGrid("B", "group-b-players");
      } catch (error) {
        console.error("Erro ao carregar dados dos jogadores:", error);
      }
    }

    function renderPlayersGrid(group, containerId) {
      const container = document.getElementById(containerId);
      const groupPlayers = allPlayers.filter(p => p.group === group);

      if (groupPlayers.length === 0) {
        container.innerHTML = `<p class="text-secondary" style="grid-column:1/-1;text-align:center;">Sem jogadores.</p>`;
        return;
      }

      container.innerHTML = groupPlayers.map(p => {
        const initials = p.name.trim().split(" ").map(n => n[0]).slice(0, 2).join("").toUpperCase();
        const avatarHtml = p.avatarBase64 
          ? `<img src="${p.avatarBase64}" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block;" />`
          : initials;
        return `
          <div class="player-card" id="p-card-${p.id}" onclick="showPlayerDetails('${p.id}')">
            <div class="player-avatar" style="padding: 0; overflow: hidden;">${avatarHtml}</div>
            <div style="font-weight:700; font-size:13px; text-overflow:ellipsis; overflow:hidden; white-space:nowrap;">${p.name}</div>
          </div>
        `;
      }).join("");
    }

    function showPlayerDetails(playerId) {
      if (activePlayerId) {
        document.getElementById(`p-card-${activePlayerId}`)?.classList.remove("active");
      }
      activePlayerId = playerId;
      document.getElementById(`p-card-${playerId}`)?.classList.add("active");

      const player = allPlayers.find(p => p.id === playerId);
      const detailsContainer = document.getElementById("details-container");

      if (!player) return;

      // Calcular estatísticas da fase de grupos
      const groupMatches = allMatches.filter(m => m.stage === "groups" && (m.aId === playerId || m.bId === playerId) && m.status === "finished");
      let points = 0, wins = 0, draws = 0, losses = 0, played = 0;
      
      for (const m of groupMatches) {
        played++;
        if (m.result === "draw") {
          draws++; points += 1;
        } else if (m.result === "A") {
          if (m.aId === playerId) { wins++; points += 3; } else { losses++; }
        } else if (m.result === "B") {
          if (m.bId === playerId) { wins++; points += 3; } else { losses++; }
        }
      }

      // Histórico completo de partidas do jogador
      const playerHistory = allMatches
        .filter(m => m.aId === playerId || m.bId === playerId)
        .sort((a, b) => new Date(b.date) - new Date(a.date));

      const playersMap = {};
      allPlayers.forEach(p => { playersMap[p.id] = p.name; });

      const historyRows = playerHistory.map(m => {
        const oppId = m.aId === playerId ? m.bId : m.aId;
        const opponentName = playersMap[oppId] || "A definir";
        
        let resultLabel = "";
        let color = "";
        if (m.status === "finished") {
          if (m.result === "draw") {
            resultLabel = "Empate";
            color = "var(--text-secondary)";
          } else {
            const won = (m.aId === playerId && m.result === "A") || (m.bId === playerId && m.result === "B");
            resultLabel = won ? "Vitória" : "Derrota";
            color = won ? "var(--accent-color)" : "var(--danger-color)";
          }
        } else if (m.status === "live") {
          resultLabel = "Ao Vivo";
          color = "var(--danger-color)";
        } else if (m.result === "postponed") {
          resultLabel = "Adiado";
          color = "var(--warning-color)";
        } else {
          resultLabel = "Agendado";
          color = "#58a6ff";
        }

        const dateStr = m.date ? new Date(m.date).toLocaleDateString("pt-BR") : "A definir";

        return `
          <tr>
            <td>${dateStr}</td>
            <td>× ${opponentName}</td>
            <td><span class="badge" style="background:rgba(56,139,253,0.08); color:#58a6ff;">${m.stage === 'groups' ? 'Grupos' : m.stage.toUpperCase()}</span></td>
            <td style="color:${color}; font-weight:700;">${resultLabel}</td>
          </tr>
        `;
      }).join("");

      const largeAvatarHtml = player.avatarBase64 
        ? `<img src="${player.avatarBase64}" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block;" />`
        : player.name.trim().split(" ").map(n => n[0]).slice(0, 2).join("").toUpperCase();

      detailsContainer.innerHTML = `
        <div style="display:flex; align-items:center; gap:16px; margin-bottom:20px;">
          <div class="avatar-large" style="width:64px; height:64px; font-size:20px; display:flex; align-items:center; justify-content:center; background:var(--bg-secondary); border: 2px solid var(--accent-color); border-radius:50%; font-weight:800; color:var(--accent-color); padding:0; overflow:hidden;">
            ${largeAvatarHtml}
          </div>
          <div>
            <h3 style="margin-bottom:4px;">${player.name}</h3>
            <span class="badge badge-info">Grupo ${player.group}</span>
          </div>
        </div>

        <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:8px; margin-bottom:20px; text-align:center;">
          <div style="background:var(--bg-secondary); padding:8px; border-radius:var(--radius-sm); border:1px solid var(--border-color);">
            <div style="font-size:10px; color:var(--text-secondary); text-transform:uppercase;">Jogos</div>
            <div style="font-size:18px; font-weight:800;">${played}</div>
          </div>
          <div style="background:var(--bg-secondary); padding:8px; border-radius:var(--radius-sm); border:1px solid var(--border-color);">
            <div style="font-size:10px; color:var(--text-secondary); text-transform:uppercase;">Vitórias</div>
            <div style="font-size:18px; font-weight:800; color:var(--accent-color);">${wins}</div>
          </div>
          <div style="background:var(--bg-secondary); padding:8px; border-radius:var(--radius-sm); border:1px solid var(--border-color);">
            <div style="font-size:10px; color:var(--text-secondary); text-transform:uppercase;">Empates</div>
            <div style="font-size:18px; font-weight:800;">${draws}</div>
          </div>
          <div style="background:var(--bg-secondary); padding:8px; border-radius:var(--radius-sm); border:1px solid var(--border-color);">
            <div style="font-size:10px; color:var(--text-secondary); text-transform:uppercase;">Pontos</div>
            <div style="font-size:18px; font-weight:800; color:var(--accent-color);">${points}</div>
          </div>
        </div>

        <h3 style="font-size:15px; margin-bottom:10px; border-bottom:1px solid var(--border-color); padding-bottom:6px;">Histórico Recente</h3>
        <div class="table-responsive" style="max-height: 250px; overflow-y:auto;">
          <table>
            <thead>
              <tr>
                <th>Data</th>
                <th>Adversário</th>
                <th>Etapa</th>
                <th>Resultado</th>
              </tr>
            </thead>
            <tbody>
              ${historyRows || '<tr><td colspan="4" style="text-align:center;" class="text-secondary">Sem histórico de partidas.</td></tr>'}
            </tbody>
          </table>
        </div>
      `;
    }
  </script>
</body>
</html>
