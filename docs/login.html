<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso - Champions Chess INFO</title>
  <link rel="icon" type="image/png" href="/FavIcon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-image: radial-gradient(circle at center, rgba(99, 102, 241, 0.15), transparent 500px);
    }
    .login-wrapper {
      max-width: 420px;
      width: 100%;
      padding: 16px;
    }
    .login-card {
      text-align: center;
      padding: 40px 30px;
      animation: floatIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .brand-logo-glow {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-color), #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px auto;
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.3);
    }
    .brand-logo-glow::after {
      content: '';
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, var(--accent-color));
      z-index: -1;
      opacity: 0.7;
      filter: blur(8px);
    }
    .brand-logo-glow svg {
      width: 40px;
      height: 40px;
      fill: #fff;
    }
    @keyframes floatIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="card login-card">
      <div class="brand-logo-glow">
        <!-- Ícone de Cavalo de Xadrez em SVG -->
        <svg viewBox="0 0 24 24">
          <path d="M19 22H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v18a2 2 0 0 1-2 2zM12 6a3 3 0 0 0-3 3c0 2 1.5 3 2.5 4.5-.5.5-1 1-1 2H16.5c0-1.5-.5-2.5-1.5-3.5 1-1 2-2 2-4a3 3 0 0 0-3-3h-2z"/>
        </svg>
      </div>
      
      <h1 style="font-size: 24px; font-weight: 800; margin-bottom: 8px; background: linear-gradient(135deg, #fff 60%, #a5b4fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Champions Chess INFO</h1>
      <p style="margin-bottom: 32px; font-size: 14.5px;">Acesse a plataforma oficial do campeonato de xadrez para palpites, chat ao vivo e tabelas.</p>

      <button id="btn-google-login" class="btn" style="width: 100%; height: 50px; font-size: 15px; background: linear-gradient(135deg, var(--accent-color), #059669); color: #062010; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);">
        <svg viewBox="0 0 24 24" width="18" height="18" style="fill: currentColor; margin-right: 10px; vertical-align: middle;">
          <path d="M12.24 10.285V14.4h6.887c-.648 2.41-2.519 4.114-5.136 4.114-3.51 0-6.377-2.87-6.377-6.38s2.87-6.38 6.377-6.38c1.62 0 3.097.604 4.226 1.594l3.125-3.13C19.39 2.3 16.035 1 12.24 1 6.033 1 1 6.033 1 12.24s5.033 11.24 11.24 11.24c6.478 0 11.24-4.57 11.24-11.24 0-.763-.085-1.5-.24-1.955H12.24z"/>
        </svg>
        Entrar com Google
      </button>

      <p id="login-error" style="color: var(--danger-color); margin-top: 18px; font-size: 13px; display: none;"></p>
    </div>
  </div>

  <script src="/js/security.js"></script>

  <!-- Firebase CDN v10 (Apenas Auth client-side) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    let auth;
    try {
      const resConfig = await fetch("/api/config/firebase");
      const firebaseConfig = await resConfig.json();
      const app = initializeApp(firebaseConfig);
      auth = getAuth(app);
    } catch (e) {
      console.error("Erro ao carregar configurações do Firebase:", e);
    }

    window.loginWithGoogleFirebase = async () => {
      if (!auth) {
        throw new Error("Erro de configuração do Firebase.");
      }
      const provider = new GoogleAuthProvider();
      try {
        const result = await signInWithPopup(auth, provider);
        const token = await result.user.getIdToken();
        return { token, user: result.user };
      } catch (error) {
        console.error("Erro Google popup:", error);
        throw error;
      }
    };
  </script>

  <script>
    document.getElementById("btn-google-login").addEventListener("click", async () => {
      const errorEl = document.getElementById("login-error");
      const btn = document.getElementById("btn-google-login");
      errorEl.style.display = "none";
      btn.disabled = true;

      try {
        const { token, user } = await window.loginWithGoogleFirebase();
        
        // Configurar cookie de sessão token
        document.cookie = `session_token=${token}; max-age=36000; path=/`;

        // Chamar backend para inicializar perfil / carteira
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          }
        });

        const data = await res.json();
        if (data.success) {
          localStorage.setItem("user", JSON.stringify(data.user));
          window.location.href = "/"; // Ir para Home
        } else {
          errorEl.textContent = data.error || "Erro ao conectar com o servidor.";
          errorEl.style.display = "block";
          btn.disabled = false;
        }
      } catch (error) {
        errorEl.textContent = "Erro no login do Google popup. Tente novamente.";
        errorEl.style.display = "block";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
