<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso - Champions Chess INFO</title>
  <link rel="icon" type="image/png" href="FavIcon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-image: radial-gradient(circle at center, rgba(99, 102, 241, 0.15), transparent 500px);
    }
    .login-wrapper {
      max-width: 420px;
      width: 100%;
      padding: 16px;
    }
    .login-card {
      text-align: center;
      padding: 40px 30px;
      animation: floatIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .brand-logo-glow {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-color), #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px auto;
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.3);
    }
    .brand-logo-glow::after {
      content: '';
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, var(--accent-color));
      z-index: -1;
      opacity: 0.7;
      filter: blur(8px);
    }
    .brand-logo-glow svg {
      width: 40px;
      height: 40px;
      fill: #fff;
    }
    @keyframes floatIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="card login-card">
      <div class="brand-logo-glow">
        <svg viewBox="0 0 24 24">
          <path d="M12 2a10 10 0 0 0-10 10c0 5.52 4.47 10 10 10a10 10 0 0 0 10-10A10 10 0 0 0 12 2zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z"/>
        </svg>
      </div>
      
      <h1 style="font-size: 24px; font-weight: 800; margin-bottom: 8px; background: linear-gradient(135deg, #fff 60%, #a5b4fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Champions Chess INFO</h1>
      <p style="margin-bottom: 32px; font-size: 14.5px;">Acesse a plataforma oficial do campeonato de xadrez para palpites, chat ao vivo e tabelas.</p>

      <button id="btn-google-login" class="btn" style="width: 100%; height: 50px; font-size: 15px; background: linear-gradient(135deg, var(--accent-color), #059669); color: #062010; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);">
        <svg viewBox="0 0 24 24" width="18" height="18" style="fill: currentColor; margin-right: 10px; vertical-align: middle;">
          <path d="M12.24 10.285V14.4h6.887c-.648 2.41-2.519 4.114-5.136 4.114-3.51 0-6.377-2.87-6.377-6.38s2.87-6.38 6.377-6.38c1.62 0 3.097.604 4.226 1.594l3.125-3.13C19.39 2.3 16.035 1 12.24 1 6.033 1 1 6.033 1 12.24s5.033 11.24 11.24 11.24c6.478 0 11.24-4.57 11.24-11.24 0-.763-.085-1.5-.24-1.955H12.24z"/>
        </svg>
        Entrar com Google
      </button>

      <p id="login-error" style="color: var(--danger-color); margin-top: 18px; font-size: 13px; display: none;"></p>
    </div>
  </div>

  <script src="js/security.js"></script>

  <!-- Firebase CDNs Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <script>
    document.getElementById("btn-google-login").addEventListener("click", () => {
      const errorEl = document.getElementById("login-error");
      const btn = document.getElementById("btn-google-login");
      errorEl.style.display = "none";
      btn.disabled = true;

      const provider = new firebase.auth.GoogleAuthProvider();
      window.auth.signInWithPopup(provider)
        .then((result) => {
          const user = result.user;
          
          // Salvar dados básicos temporários
          const userLocal = {
            uid: user.uid,
            name: user.displayName || "Usuário",
            email: user.email,
            avatarBase64: user.photoURL || "https://lh3.googleusercontent.com/a/default-user=s96-c",
            role: "spectator",
            isAdmin: false,
            participantStatus: "none"
          };
          localStorage.setItem("user", JSON.stringify(userLocal));
          
          // Redireciona para home, o firebase-config.js nas outras páginas 
          // lidará com carregar/sincronizar o Firestore automaticamente
          window.location.href = "index.html";
        })
        .catch((error) => {
          console.error("Erro login Google popup:", error);
          errorEl.textContent = "Erro no login do Google popup. Tente novamente.";
          errorEl.style.display = "block";
          btn.disabled = false;
        });
    });
  </script>
</body>
</html>
