<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partidas - Champions Chess INFO</title>
  <link rel="icon" type="image/png" href="FavIcon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <main class="container">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; border-bottom:1px solid var(--border-color); padding-bottom:12px; margin-bottom:16px;">
        <h2 style="border:none; padding-bottom:0; margin-bottom:0;">⚔️ Partidas do Torneio</h2>
        <div>
          <select id="filter-stage" class="form-control" style="width: 180px; padding: 8px;">
            <option value="all">Todas as Etapas</option>
            <option value="groups">Fase de Grupos</option>
            <option value="groupA">Grupo A</option>
            <option value="groupB">Grupo B</option>
            <option value="semifinal">Semifinais</option>
            <option value="final">Finais / 3º Lugar</option>
          </select>
        </div>
      </div>
      
      <p style="margin-bottom: 20px;">
        Abaixo estão os confrontos agendados e os resultados. Se você for participante de uma partida, clique em <b>"Estou Pronto"</b> no horário do jogo para iniciar o matchmaking em tempo real!
      </p>

      <div id="matches-container" style="display: flex; flex-direction: column; gap: 16px;">
        <!-- Injetado dinamicamente -->
        <p class="text-secondary" style="text-align: center;">Carregando confrontos...</p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <span>© Champions Chess INFO</span>
  </footer>

  <!-- Firebase CDNs Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <script src="js/navigation.js"></script>
  <script src="js/security.js"></script>

  <script>
    let currentUser = null;
    let playersMap = {};
    let allMatches = [];

    document.addEventListener("DOMContentLoaded", () => {
      // Ler usuário do localStorage
      try {
        const userStr = localStorage.getItem("user");
        if (userStr) currentUser = JSON.parse(userStr);
      } catch (e) {}

      // Aguarda a inicialização do Firebase Auth
      const interval = setInterval(() => {
        if (window.auth && window.db) {
          clearInterval(interval);
          window.auth.onAuthStateChanged((user) => {
            if (user) {
              initPartidas();
            }
          });
        }
      }, 100);

      // Listener de Filtro
      document.getElementById("filter-stage").addEventListener("change", renderMatches);
    });

    async function initPartidas() {
      try {
        // 1. Carregar jogadores
        const snap = await window.db.collection("players").get();
        snap.forEach(doc => {
          const data = doc.data();
          playersMap[doc.id] = {
            name: data.name || "A definir",
            avatar: data.avatarBase64 || "https://lh3.googleusercontent.com/a/default-user=s96-c"
          };
        });

        // 2. Ouvir partidas em tempo real
        window.db.collection("matches").onSnapshot(snapshot => {
          allMatches = [];
          snapshot.forEach(doc => {
            allMatches.push({ id: doc.id, ...doc.data() });
          });
          renderMatches();
        });
      } catch (error) {
        console.error("Erro ao inicializar partidas:", error);
      }
    }

    function renderMatches() {
      const filterVal = document.getElementById("filter-stage").value;
      const container = document.getElementById("matches-container");
      
      let list = [...allMatches];

      // Aplicar filtros
      if (filterVal === "groups") {
        list = list.filter(m => m.stage === "groups");
      } else if (filterVal === "groupA") {
        list = list.filter(m => m.stage === "groups" && m.group === "A");
      } else if (filterVal === "groupB") {
        list = list.filter(m => m.stage === "groups" && m.group === "B");
      } else if (filterVal === "semifinal") {
        list = list.filter(m => m.stage === "semifinal");
      } else if (filterVal === "final") {
        list = list.filter(m => m.stage === "final" || m.stage === "third");
      }

      // Ordenar por data
      list.sort((a, b) => new Date(a.date) - new Date(b.date));

      if (list.length === 0) {
        container.innerHTML = `<p class="text-secondary" style="text-align: center; padding: 24px;">Nenhuma partida encontrada para esta etapa.</p>`;
        return;
      }

      container.innerHTML = list.map(m => renderMatchCard(m)).join("");
      fetchOnlineResults(list);
    }

    function renderMatchCard(m) {
      const pA = playersMap[m.aId] || { name: "A definir", avatar: "https://lh3.googleusercontent.com/a/default-user=s96-c" };
      const pB = playersMap[m.bId] || { name: "A definir", avatar: "https://lh3.googleusercontent.com/a/default-user=s96-c" };
      
      const playerAName = pA.name;
      const playerBName = pB.name;
      const avatarA = pA.avatar;
      const avatarB = pB.avatar;
      
      const dateStr = m.date 
        ? new Date(m.date).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" }) 
        : "Horário a definir";
      
      const baseStage = m.stage === "groups" ? `Grupo ${m.group}` : m.stage.toUpperCase();
      const stageLabel = baseStage + (m.code ? ` • ${m.code}` : "");
      
      // Status de prontidão e escolha do tipo
      const isReadyA = !!m.readyA;
      const isReadyB = !!m.readyB;
      const isGameActive = m.status === "live" || (isReadyA && isReadyB && m.status !== "finished");
      
      // Resolvido como online apenas se ambos escolherem online. Caso contrário (ou se for legado), presencial.
      const isOnline = m.type === "online" || (m.readyA === "online" && m.readyB === "online");

      // Status badges e resultados
      let statusHtml = "";
      let resultHtml = "";
      let actionHtml = "";

      if (m.status === "finished") {
        statusHtml = `<span class="badge badge-success">Finalizado</span>`;
        let winnerText = "";
        if (m.result === "draw") winnerText = "Empate";
        else if (m.result === "A") winnerText = `Vitória de ${playerAName}`;
        else if (m.result === "B") winnerText = `Vitória de ${playerBName}`;
        resultHtml = `<div style="font-weight:700; color:var(--accent-color); margin-top:8px;">${winnerText}</div>`;

        // Botão de ver a partida gravada (URL externa) ou Replay no Tabuleiro do site
        if (m.recordingUrl) {
          actionHtml = `<a href="${m.recordingUrl}" target="_blank" class="btn" style="margin-top:12px; width:100%; display:block; text-align:center; text-decoration:none; background: linear-gradient(135deg, var(--accent-color), #059669); color:#fff; font-weight:800; border:none; box-shadow: 0 0 15px rgba(16, 185, 129, 0.25);">🎥 Ver Partida Gravada</a>`;
        } else if (isOnline) {
          actionHtml = `<a href="jogo.html?matchId=${m.id}" class="btn btn-ghost" style="margin-top:12px; width:100%; display:block; text-align:center; text-decoration:none; border: 1px solid var(--accent-color); color: var(--accent-color); font-weight:800;">👁 Replay no Tabuleiro</a>`;
        }
      } else if (isGameActive) {
        statusHtml = `<span class="badge badge-danger" style="animation: pulse 1.5s infinite; background:#ef4444; color:#fff;">AO VIVO</span>`;
        if (isOnline) {
          resultHtml = `<div style="font-weight:700; color:var(--danger-color); margin-top:8px; font-size: 13px;">Partida em andamento no tabuleiro do site!</div>`;
          const isPlayer = currentUser && (m.aId === currentUser.uid || m.bId === currentUser.uid);
          if (isPlayer) {
            actionHtml = `<a href="jogo.html?matchId=${m.id}" class="btn" style="margin-top:12px; width:100%; display:block; text-align:center; text-decoration:none; background-color: var(--accent-color); color:#fff; font-weight:800; border-color: var(--accent-color);">🎮 Jogar Online</a>`;
          } else {
            actionHtml = `<a href="jogo.html?matchId=${m.id}" class="btn btn-ghost" style="margin-top:12px; width:100%; display:block; text-align:center; text-decoration:none;">👁 Assistir Partida</a>`;
          }
        } else {
          resultHtml = `<div style="font-weight:700; color:var(--accent-color); margin-top:8px; font-size: 13px;">Confronto presencial (Tabuleiro Físico)!</div>`;
          actionHtml = `<div style="background: rgba(88, 166, 255, 0.1); border: 1px solid rgba(88, 166, 255, 0.2); padding: 8px 12px; border-radius: 6px; margin-top: 12px; font-size:12px; font-weight:700; text-align:center; color:#58a6ff;">⚔️ Confronto Físico em Andamento</div>`;
        }
      } else if (m.result === "postponed") {
        statusHtml = `<span class="badge badge-warning">Adiado</span>`;
        resultHtml = `<div style="color:var(--warning-color); margin-top:4px; font-size:12px;">Confronto remarcado pela organização.</div>`;
      } else {
        statusHtml = `<span class="badge badge-info">Agendado</span>`;
        
        // Se ainda agendado, exibir opções de escolha de tipo
        if (currentUser && (m.aId === currentUser.uid || m.bId === currentUser.uid)) {
          const isPlayerA = m.aId === currentUser.uid;
          const myReady = isPlayerA ? m.readyA : m.readyB;
          const isAlreadyReady = !!myReady;
          
          if (isAlreadyReady) {
            const label = myReady === "online" ? "💻 Online" : "🤝 Presencial";
            actionHtml = `<button class="btn btn-ghost" disabled style="margin-top:12px; width:100%; cursor: not-allowed;">Pronto (${label}) - Aguardando oponente...</button>`;
          } else {
            actionHtml = `
              <div style="display:flex; gap:8px; margin-top:12px; width:100%;">
                <button class="btn" onclick="signalReady('${m.id}', 'online')" style="flex:1; padding: 10px; font-size:12px;">💻 Online</button>
                <button class="btn btn-ghost" onclick="signalReady('${m.id}', 'presencial')" style="flex:1; padding: 10px; font-size:12px; border:1px solid var(--border-color);">🤝 Presencial</button>
              </div>
            `;
          }
        }
      }

      // Preparação de status de prontidão (matchmaking)
      let readyIndicators = "";
      if (m.status !== "finished" && !isGameActive && m.result !== "postponed" && (m.readyA || m.readyB)) {
        const choiceALabel = m.readyA ? (m.readyA === "online" ? "🟢 Pronto (💻 Online)" : "🟢 Pronto (🤝 Presencial)") : "⚪ Pendente";
        const choiceBLabel = m.readyB ? (m.readyB === "online" ? "🟢 Pronto (💻 Online)" : "🟢 Pronto (🤝 Presencial)") : "⚪ Pendente";
        readyIndicators = `
          <div style="font-size:12px; color:var(--text-secondary); margin-top:8px; display:flex; flex-direction:column; gap:4px;">
            <span><b>${playerAName}</b>: ${choiceALabel}</span>
            <span><b>${playerBName}</b>: ${choiceBLabel}</span>
          </div>
        `;
      }

      // Badge de tipo de partida centralizada e decorada
      let typeBadge = "";
      if (isGameActive || m.status === "finished") {
        typeBadge = `
          <div style="display:flex; justify-content:center; margin: 4px 0 10px 0;">
            <span class="badge" style="padding: 5px 12px; border-radius: 9999px; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.04em; display:flex; align-items:center; gap:6px; background:${isOnline ? 'rgba(56,139,253,0.1)' : 'rgba(240,178,50,0.1)'}; color:${isOnline ? '#58a6ff' : '#f0b232'}; border:1px solid ${isOnline ? 'rgba(56,139,253,0.2)' : 'rgba(240,178,50,0.2)'}; box-shadow: 0 0 12px ${isOnline ? 'rgba(56,139,253,0.1)' : 'rgba(240,178,50,0.1)'};">
              ${isOnline ? "💻 Online" : "🤝 Presencial"}
            </span>
          </div>
        `;
      } else if (m.result !== "postponed") {
        typeBadge = `
          <div style="display:flex; justify-content:center; margin: 4px 0 10px 0;">
            <span class="badge" style="padding: 5px 12px; border-radius: 9999px; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.04em; display:flex; align-items:center; gap:6px; background:rgba(255,255,255,0.05); color:var(--text-secondary); border:1px solid var(--border-color);">
              ⏳ Aguardando Escolha
            </span>
          </div>
        `;
      }

      let adminActionHtml = "";
      const isUserAdmin = currentUser && (currentUser.role === "admin" || currentUser.isAdmin === true);
      if (isUserAdmin) {
        adminActionHtml = `
          <button class="btn btn-ghost" onclick="editMatchRecording('${m.id}', '${m.recordingUrl || ""}')" style="margin-top:8px; width:100%; display:block; padding: 6px; font-size:11px; border: 1px dashed var(--border-color); border-radius:6px; cursor:pointer;">
            ⚙️ Editar Gravação
          </button>
        `;
      }

      return `
        <div class="bet-match-card" id="match-card-${m.id}" style="border: 1px solid var(--border-color); background: rgba(22, 30, 41, 0.4);">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:12px; color:var(--text-secondary); font-weight:600; white-space:nowrap;">${dateStr}</span>
            <span class="badge" style="background:rgba(56,139,253,0.15); color:#58a6ff; white-space:nowrap;">${stageLabel}</span>
          </div>
          
          <div class="versus" style="margin: 16px 0; display:flex; align-items:center; justify-content:space-around; gap:12px;">
            <div style="display:flex; flex-direction:column; align-items:center; text-align:center; width:42%;">
              <div style="width: 52px; height: 52px; border-radius: 50%; overflow: hidden; border: 2px solid var(--border-color); margin-bottom: 8px; background: rgba(255,255,255,0.03); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
                <img src="${avatarA}" alt="${playerAName}" style="width: 100%; height: 100%; object-fit: cover;">
              </div>
              <span style="font-size: 13.5px; font-weight: 700; color: var(--text-primary); word-break: break-all;">${playerAName}</span>
            </div>
            
            <div class="vs" style="font-size: 11px; font-weight: 800; color: var(--text-secondary); background: rgba(255,255,255,0.05); padding: 6px 10px; border-radius: 50%; border: 1px solid var(--border-color);">VS</div>
            
            <div style="display:flex; flex-direction:column; align-items:center; text-align:center; width:42%;">
              <div style="width: 52px; height: 52px; border-radius: 50%; overflow: hidden; border: 2px solid var(--border-color); margin-bottom: 8px; background: rgba(255,255,255,0.03); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
                <img src="${avatarB}" alt="${playerBName}" style="width: 100%; height: 100%; object-fit: cover;">
              </div>
              <span style="font-size: 13.5px; font-weight: 700; color: var(--text-primary); word-break: break-all;">${playerBName}</span>
            </div>
          </div>

          ${typeBadge}
          
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:nowrap;">
            ${statusHtml}
          </div>
          
          ${resultHtml}
          ${readyIndicators}
          <div id="online-result-${m.id}"></div>
          ${actionHtml}
          ${adminActionHtml}
        </div>
      `;
    }

    function fetchOnlineResults(list) {
      list.forEach(m => {
        const isOnline = m.type === "online" || (m.readyA === "online" && m.readyB === "online");
        if (isOnline && m.status !== "finished") {
          window.rtdb.ref("matches_games/" + m.id).once("value").then((snap) => {
            const gameData = snap.val();
            if (gameData && gameData.status === "finished" && gameData.winner) {
              const playerAName = (playersMap[m.aId] ? playersMap[m.aId].name : "") || "Jogador A";
              const playerBName = (playersMap[m.bId] ? playersMap[m.bId].name : "") || "Jogador B";
              let winnerName = "Empate";
              if (gameData.winner === "w") winnerName = `Vitória de ${playerAName}`;
              else if (gameData.winner === "b") winnerName = `Vitória de ${playerBName}`;

              const resultContainer = document.getElementById(`online-result-${m.id}`);
              if (resultContainer) {
                resultContainer.innerHTML = `
                  <div style="background: rgba(16, 185, 129, 0.1); border: 1px solid var(--accent-color); padding: 8px 12px; border-radius: 6px; margin-top: 10px; margin-bottom: 4px;">
                    <span style="font-size:12px; font-weight:700; color:var(--accent-color);">🏁 Concluído Online:</span>
                    <div style="font-size:13px; font-weight:800; color:#fff; margin-top:2px;">${winnerName}</div>
                    <div style="font-size:10px; color:var(--text-secondary); margin-top:2px;">Aguardando homologação do Administrador.</div>
                  </div>
                `;
              }
            }
          }).catch(err => console.error("Erro ao carregar resultado online:", err));
        }
      });
    }

    async function signalReady(matchId, choice) {
      if (!currentUser) return;

      const matchRef = window.db.collection("matches").doc(matchId);

      try {
        let raffleResult = null;

        await window.db.runTransaction(async (transaction) => {
          const matchDoc = await transaction.get(matchRef);
          if (!matchDoc.exists) throw new Error("Confronto não existe.");

          const data = matchDoc.data();
          const isPlayerA = data.aId === currentUser.uid;
          const isPlayerB = data.bId === currentUser.uid;

          const updates = {};
          if (isPlayerA) updates.readyA = choice;
          if (isPlayerB) updates.readyB = choice;

          // Verificar se ambos estão prontos após este update
          const finalReadyA = isPlayerA ? choice : data.readyA;
          const finalReadyB = isPlayerB ? choice : data.readyB;

          if (finalReadyA && finalReadyB) {
            // Se as escolhas forem iguais, define o tipo de partida
            if (finalReadyA === finalReadyB) {
              updates.type = finalReadyA;
            } else {
              // Se forem diferentes, faz o sorteio!
              raffleResult = Math.random() < 0.5 ? "online" : "presencial";
              updates.type = raffleResult;
              updates.raffleResult = raffleResult;
            }
          }

          transaction.update(matchRef, updates);
        });

        if (raffleResult) {
          const label = raffleResult === "online" ? "💻 Online (Site)" : "🤝 Presencial (Mesa Física)";
          window.customAlert(`🎲 Escolhas divergentes detectadas! O sorteio determinou que a partida será: **${label}**.`);
        } else {
          window.customAlert("Seu estado de prontidão e formato de preferência foram salvos!");
        }
      } catch (error) {
        console.error("Erro ao atualizar prontidão:", error);
        window.customAlert("Erro ao enviar estado de pronto. Tente novamente.");
      }
    }

    window.editMatchRecording = async function(matchId, currentUrl) {
      let modal = document.createElement("div");
      modal.style.cssText = "position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(6,9,19,0.9); backdrop-filter:blur(8px); z-index:10009; display:flex; align-items:center; justify-content:center; padding:20px;";
      
      modal.innerHTML = `
        <div class="card" style="max-width:400px; width:100%; border:1px solid var(--border-color); padding:24px; background:var(--bg-secondary); box-shadow: 0 8px 32px rgba(0,0,0,0.5);">
          <h3 style="margin-bottom:16px; font-weight:800; font-size:16px; color:#fff;">🎥 Editar Gravação da Partida</h3>
          <p style="font-size:12px; color:var(--text-secondary); margin-bottom:16px;">Insira a URL da gravação (YouTube, Lichess, etc.) para este confronto:</p>
          <input type="url" id="custom-modal-url-input" class="form-control" style="width:100%; margin-bottom:16px; background: rgba(255,255,255,0.05); border:1px solid var(--border-color); color:#fff; padding:10px; border-radius:6px;" value="${currentUrl}" placeholder="https://...">
          <div style="display:flex; gap:10px; justify-content:flex-end;">
            <button class="btn btn-ghost" id="custom-modal-cancel" style="padding:8px 16px; cursor:pointer;">Cancelar</button>
            <button class="btn" id="custom-modal-save" style="padding:8px 16px; background-color: var(--accent-color); color:#fff; border:none; border-radius:6px; font-weight:700; cursor:pointer;">Salvar</button>
          </div>
        </div>
      `;
      
      document.body.appendChild(modal);

      return new Promise((resolve) => {
        modal.querySelector("#custom-modal-cancel").onclick = () => {
          modal.remove();
          resolve(null);
        };

        modal.querySelector("#custom-modal-save").onclick = async () => {
          const urlInput = modal.querySelector("#custom-modal-url-input").value.trim();
          modal.remove();
          
          try {
            await window.db.collection("matches").doc(matchId).update({
              recordingUrl: urlInput
            });
          } catch(e) {
            console.error(e);
            alert("Erro ao salvar link da gravação.");
          }
          resolve(urlInput);
        };
      });
    };
  </script>
</body>
</html>
