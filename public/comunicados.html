<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comunicados - Champions Chess INFO</title>
  <link rel="icon" type="image/png" href="/FavIcon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <main class="container">
    <!-- Formulário de Novo Comunicado (Somente Admin) -->
    <div id="admin-post-card" class="card" style="display: none; margin-bottom: 24px;">
      <h2>📢 Novo Comunicado (Painel Admin)</h2>
      <form id="new-post-form">
        <div class="form-group">
          <label for="post-title">Título do Comunicado</label>
          <input type="text" id="post-title" class="form-control" placeholder="Digite o título..." required autocomplete="off">
        </div>
        <div class="form-group">
          <label for="post-body">Corpo da Mensagem</label>
          <textarea id="post-body" class="form-control" rows="4" placeholder="Escreva o comunicado aqui..." required></textarea>
        </div>
        <button type="submit" class="btn">Publicar Comunicado</button>
      </form>
    </div>

    <!-- Lista de Comunicados -->
    <div class="card">
      <h2>📢 Comunicados Oficiais</h2>
      <div id="posts-timeline" style="display: flex; flex-direction: column; gap: 20px; margin-top: 16px;">
        <p class="text-secondary" style="text-align: center; padding: 24px;">Carregando comunicados...</p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <span>© Champions Chess INFO</span>
  </footer>

  <script src="/js/navigation.js"></script>
  <script src="/js/security.js"></script>

  <script>
    let currentUser = null;

    document.addEventListener("DOMContentLoaded", async () => {
      // Ler usuário do localStorage
      try {
        const userStr = localStorage.getItem("user");
        if (userStr) currentUser = JSON.parse(userStr);
      } catch (e) {}

      // Mostrar formulário se for admin
      if (currentUser && (currentUser.role === "admin" || currentUser.isAdmin)) {
        document.getElementById("admin-post-card").style.display = "block";
      }

      // Carregar comunicados
      loadPosts();

      // Envio de formulário
      document.getElementById("new-post-form").addEventListener("submit", createPost);
    });

    async function loadPosts() {
      const timeline = document.getElementById("posts-timeline");
      
      try {
        const res = await fetch("/api/posts");
        const list = await res.json();

        if (list.length === 0) {
          timeline.innerHTML = `<p class="text-secondary" style="text-align: center; padding: 24px;">Nenhum comunicado oficial publicado.</p>`;
          return;
        }

        timeline.innerHTML = list.map(p => {
          const dateStr = p.createdAt ? new Date(p.createdAt).toLocaleString("pt-BR") : "Agora";
          const deleteBtn = currentUser && (currentUser.role === "admin" || currentUser.isAdmin)
            ? `<button class="btn btn-danger" onclick="deletePost('${p.id}')" style="padding: 6px 12px; font-size:11px; margin-top: 12px;">Excluir</button>`
            : "";

          return `
            <div style="border-bottom: 1px solid var(--border-color); padding-bottom: 16px; position:relative;">
              <h3 style="font-size: 18px; margin-bottom: 6px;">${p.title}</h3>
              <div style="font-size: 11px; color: var(--text-secondary); margin-bottom: 12px; display:flex; gap:12px; flex-wrap:wrap;">
                <span>🕒 Publicado em: <b>${dateStr}</b></span>
                <span>👤 Autor: <b>${p.authorName || 'Organização'}</b></span>
              </div>
              <div style="font-size: 14px; color: var(--text-primary); white-space: pre-line; line-height: 1.6;">${p.body}</div>
              ${deleteBtn}
            </div>
          `;
        }).join("");
      } catch (error) {
        timeline.innerHTML = `<p class="text-secondary" style="text-align: center;">Erro ao carregar comunicados.</p>`;
      }
    }

    async function createPost(e) {
      e.preventDefault();
      
      const title = document.getElementById("post-title").value.trim();
      const body = document.getElementById("post-body").value.trim();

      const token = document.cookie.split("; ").find(r => r.startsWith("session_token="))?.split("=")[1];
      if (!token) {
        alert("Sessão expirada. Refaça o login.");
        return;
      }

      try {
        const res = await fetch("/api/posts", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ title, body })
        });
        
        const data = await res.json();
        if (data.id) {
          document.getElementById("post-title").value = "";
          document.getElementById("post-body").value = "";
          loadPosts(); // Recarregar timeline
        } else {
          alert(data.error || "Erro ao publicar comunicado.");
        }
      } catch (error) {
        alert("Erro de conexão.");
      }
    }

    async function deletePost(postId) {
      if (!confirm("Tem certeza que deseja excluir este comunicado?")) return;

      const token = document.cookie.split("; ").find(r => r.startsWith("session_token="))?.split("=")[1];
      if (!token) {
        alert("Sessão expirada.");
        return;
      }

      try {
        const res = await fetch(`/api/posts/${postId}`, {
          method: "DELETE",
          headers: {
            "Authorization": `Bearer ${token}`
          }
        });
        const data = await res.json();
        if (data.success) {
          loadPosts();
        } else {
          alert(data.error || "Erro ao excluir comunicado.");
        }
      } catch (error) {
        alert("Erro de conexão.");
      }
    }
  </script>
</body>
</html>
